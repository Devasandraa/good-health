<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d3a">
<title>GoodHealth</title>
<style>
:root{--ink:#10302e;--muted:#5d7774;--bg:#eef4f2;--card:#fff;--teal:#0f8f84;--deep:#0b3d3a;--coral:#e8574a;--line:#d5e2df}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
 padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{padding:22px 0 12px}
h1{font-size:30px;margin:0;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.hero{background:var(--deep);color:#fff;border-radius:22px;padding:20px;margin:8px 0 14px}
.hero .lbl{opacity:.75;font-size:14px}
.hero .big{font-size:56px;font-weight:700;line-height:1.05;margin-top:4px}
.hero .big small{font-size:18px;font-weight:500;opacity:.8;margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card .lbl{color:var(--muted);font-size:13px}
.card .val{font-size:26px;font-weight:700;margin-top:4px}
.card .val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.actions{display:grid;gap:10px;margin:16px 0}
button{font:inherit;font-size:16px;font-weight:600;border-radius:14px;padding:15px;border:2px solid var(--teal);background:#fff;color:var(--teal);width:100%}
button.primary{background:var(--teal);color:#fff}
button:active{transform:scale(.99)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button:disabled{opacity:.6}
#msg{min-height:22px;font-size:14px;color:var(--muted);margin:6px 2px}
#msg.err{color:#b3261e}
#msg.ok{color:#0b6b4f}
h2{font-size:18px;margin:22px 0 8px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{display:block;width:100%;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:3px}
.bar span{font-size:11px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);font-size:14px;padding:18px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
dialog{border:none;border-radius:20px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}
.row{display:flex;gap:10px;margin-top:16px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>GoodHealth</h1>
  <div class="sub" id="synced">Not synced yet</div>
</header>

<section class="hero" aria-live="polite">
  <div class="lbl">Heart rate</div>
  <div class="big"><span id="hr">--</span><small>bpm</small></div>
</section>

<section class="grid">
  <div class="card"><div class="lbl">Resting heart rate</div><div class="val"><span id="rhr">--</span><small>bpm</small></div></div>
  <div class="card"><div class="lbl">HRV</div><div class="val"><span id="hrv">--</span><small>ms</small></div></div>
  <div class="card"><div class="lbl">Blood oxygen</div><div class="val"><span id="spo2">--</span><small>%</small></div></div>
  <div class="card"><div class="lbl">Sleep</div><div class="val"><span id="sleep">--</span></div></div>
  <div class="card" style="grid-column:1/-1"><div class="lbl">Steps today</div><div class="val"><span id="steps">--</span></div></div>
</section>

<div class="actions">
  <button class="primary" id="syncBtn">Sync from Health Connect</button>
  <button id="manualBtn">Enter manually</button>
  <button id="pdfBtn">Download report (PDF)</button>
</div>
<div id="msg" role="status"></div>

<h2>Steps, last 7 days</h2>
<div id="trend"></div>

<div class="foot">For wellbeing tracking only. Not medical advice.</div>

<dialog id="dlg">
  <form method="dialog" id="manualForm">
    <h2 style="margin-top:0">Enter manually</h2>
    <label for="m_hr">Heart rate (bpm)</label><input id="m_hr" type="number" inputmode="numeric">
    <label for="m_rhr">Resting heart rate (bpm)</label><input id="m_rhr" type="number" inputmode="numeric">
    <label for="m_hrv">HRV (ms)</label><input id="m_hrv" type="number" inputmode="numeric">
    <label for="m_spo2">Blood oxygen (%)</label><input id="m_spo2" type="number" inputmode="numeric">
    <label for="m_sleep">Sleep (hours)</label><input id="m_sleep" type="number" step="0.1" inputmode="decimal">
    <label for="m_steps">Steps today</label><input id="m_steps" type="number" inputmode="numeric">
    <div class="row">
      <button type="button" id="cancelM">Cancel</button>
      <button type="submit" class="primary" id="saveM">Save</button>
    </div>
  </form>
</dialog>

<script src="jspdf.umd.min.js"></script>
<script>
(function () {
  var KEY = 'wellsense_state_v1';
  var state = load();
  var cap = window.Capacitor;
  var cache = {};

  function $(id) { return document.getElementById(id); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function isNative() { return !!(cap && cap.isNativePlatform && cap.isNativePlatform()); }
  function plugin(name) {
    if (cache[name]) return cache[name];
    if (!cap) return null;
    var p = (cap.Plugins && cap.Plugins[name]) || (cap.registerPlugin ? cap.registerPlugin(name) : null);
    cache[name] = p;
    return p;
  }
  function say(text, kind) { var m = $('msg'); m.textContent = text; m.className = kind || ''; }
  function fmtSleep(min) { if (min == null) return '--'; return Math.floor(min / 60) + 'h ' + Math.round(min % 60) + 'm'; }
  function num(v) { return v == null || isNaN(v) ? '--' : String(Math.round(v)); }

  function render() {
    $('hr').textContent = num(state.hr);
    $('rhr').textContent = num(state.rhr);
    $('hrv').textContent = num(state.hrv);
    $('spo2').textContent = num(state.spo2);
    $('sleep').textContent = fmtSleep(state.sleepMin);
    $('steps').textContent = state.steps == null ? '--' : Math.round(state.steps).toLocaleString();
    $('synced').textContent = state.syncedAt ? 'Updated ' + new Date(state.syncedAt).toLocaleString() + (state.source ? ' (' + state.source + ')' : '') : 'Not synced yet';
    var t = $('trend');
    var tr = state.stepsTrend || [];
    if (!tr.length) { t.innerHTML = '<div class="empty">No history yet. Tap Sync from Health Connect to load your last 7 days.</div>'; return; }
    var max = Math.max.apply(null, tr.map(function (x) { return x.v; }).concat([1]));
    t.innerHTML = '<div class="bars">' + tr.map(function (x) {
      return '<div class="bar" title="' + Math.round(x.v) + ' steps"><i style="height:' + Math.max(3, (x.v / max) * 100) + '%"></i><span>' + x.d + '</span></div>';
    }).join('') + '</div>';
  }

  // ---------- Health Connect ----------
  function mergedMinutes(samples) {
    var iv = [];
    samples.forEach(function (s) {
      var st = s.sleepState;
      if (st === 'awake' || st === 'inBed') return;
      var a = new Date(s.startDate).getTime(), b = new Date(s.endDate).getTime();
      if (b > a) iv.push([a, b]);
    });
    iv.sort(function (x, y) { return x[0] - y[0]; });
    var total = 0, cur = null;
    iv.forEach(function (x) {
      if (!cur) { cur = x.slice(); return; }
      if (x[0] <= cur[1]) { cur[1] = Math.max(cur[1], x[1]); }
      else { total += cur[1] - cur[0]; cur = x.slice(); }
    });
    if (cur) total += cur[1] - cur[0];
    return total / 60000;
  }

  async function latest(H, type, hoursBack) {
    var end = new Date(), start = new Date(end.getTime() - hoursBack * 3600 * 1000);
    var r = await H.readSamples({ dataType: type, startDate: start.toISOString(), endDate: end.toISOString(), limit: 1, ascending: false });
    return r && r.samples && r.samples.length ? r.samples[0].value : null;
  }

  async function syncHealth() {
    var btn = $('syncBtn');
    btn.disabled = true;
    try {
      if (!isNative()) throw new Error('Health Connect only works in the installed Android app, not in a browser.');
      var H = plugin('Health');
      if (!H) throw new Error('Health plugin not found in this build.');
      say('Checking Health Connect...');
      var av = await H.isAvailable();
      if (!av.available) throw new Error('Health Connect is not available' + (av.reason ? ': ' + av.reason : '') + '. Install or update Health Connect from the Play Store.');

      say('Waiting for your permission...');
      var types = ['steps', 'heartRate', 'restingHeartRate', 'heartRateVariability', 'oxygenSaturation', 'sleep'];
      var auth = await H.requestAuthorization({ read: types });
      var ok = (auth && auth.readAuthorized) || [];
      if (!ok.length) throw new Error('No permission granted. Tap Sync again and allow access in the Health Connect screen.');

      say('Reading your data...');
      var got = 0, now = new Date();
      async function tryRead(type, fn) {
        if (ok.indexOf(type) === -1) return;
        try { await fn(); } catch (e) { console.warn(type, e); }
      }
      await tryRead('heartRate', async function () { var v = await latest(H, 'heartRate', 48); if (v != null) { state.hr = v; got++; } });
      await tryRead('restingHeartRate', async function () { var v = await latest(H, 'restingHeartRate', 24 * 7); if (v != null) { state.rhr = v; got++; } });
      await tryRead('heartRateVariability', async function () { var v = await latest(H, 'heartRateVariability', 24 * 7); if (v != null) { state.hrv = v; got++; } });
      await tryRead('oxygenSaturation', async function () { var v = await latest(H, 'oxygenSaturation', 24 * 7); if (v != null) { state.spo2 = v; got++; } });
      await tryRead('sleep', async function () {
        var start = new Date(now.getTime() - 36 * 3600 * 1000);
        var r = await H.readSamples({ dataType: 'sleep', startDate: start.toISOString(), endDate: now.toISOString(), limit: 500 });
        var min = mergedMinutes((r && r.samples) || []);
        if (min > 0) { state.sleepMin = min; got++; }
      });
      await tryRead('steps', async function () {
        var start = new Date(now); start.setDate(start.getDate() - 6); start.setHours(0, 0, 0, 0);
        var r = await H.queryAggregated({ dataType: 'steps', startDate: start.toISOString(), endDate: now.toISOString(), bucket: 'day', aggregation: 'sum' });
        var s = (r && r.samples) || [];
        if (s.length) {
          state.stepsTrend = s.map(function (x) { return { d: new Date(x.startDate).toLocaleDateString(undefined, { weekday: 'short' }), v: x.value || 0 }; });
          state.steps = s[s.length - 1].value || 0;
          got++;
        }
      });

      state.syncedAt = Date.now();
      state.source = 'Health Connect';
      save(); render();
      if (got) say('Synced ' + got + ' of ' + ok.length + ' data types.', 'ok');
      else say('Connected, but Health Connect has no recent data. Open your watch app, sync it, and check that it writes to Health Connect.', 'err');
    } catch (e) {
      say(e && e.message ? e.message : String(e), 'err');
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- Manual entry ----------
  var ids = { hr: 'm_hr', rhr: 'm_rhr', hrv: 'm_hrv', spo2: 'm_spo2', steps: 'm_steps' };
  $('manualBtn').onclick = function () {
    Object.keys(ids).forEach(function (k) { $(ids[k]).value = state[k] != null ? Math.round(state[k]) : ''; });
    $('m_sleep').value = state.sleepMin != null ? (state.sleepMin / 60).toFixed(1) : '';
    $('dlg').showModal();
  };
  $('cancelM').onclick = function () { $('dlg').close(); };
  $('manualForm').onsubmit = function () {
    Object.keys(ids).forEach(function (k) { var v = parseFloat($(ids[k]).value); if (!isNaN(v)) state[k] = v; });
    var sl = parseFloat($('m_sleep').value); if (!isNaN(sl)) state.sleepMin = sl * 60;
    state.syncedAt = Date.now(); state.source = 'manual';
    save(); render(); say('Saved.', 'ok');
  };

  // ---------- PDF report ----------
  function buildPdf() {
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) throw new Error('PDF library failed to load.');
    var doc = new J({ unit: 'pt', format: 'a4' });
    var y = 60;
    doc.setFontSize(24); doc.text('GoodHealth report', 48, y); y += 22;
    doc.setFontSize(11); doc.setTextColor(100);
    doc.text('Created ' + new Date().toLocaleString(), 48, y); y += 8;
    if (state.syncedAt) { doc.text('Data updated ' + new Date(state.syncedAt).toLocaleString() + (state.source ? ' (' + state.source + ')' : ''), 48, y + 12); y += 12; }
    y += 30; doc.setTextColor(0);

    var rows = [
      ['Heart rate', state.hr != null ? Math.round(state.hr) + ' bpm' : 'No data'],
      ['Resting heart rate', state.rhr != null ? Math.round(state.rhr) + ' bpm' : 'No data'],
      ['HRV', state.hrv != null ? Math.round(state.hrv) + ' ms' : 'No data'],
      ['Blood oxygen', state.spo2 != null ? Math.round(state.spo2) + ' %' : 'No data'],
      ['Sleep', state.sleepMin != null ? fmtSleep(state.sleepMin) : 'No data'],
      ['Steps today', state.steps != null ? Math.round(state.steps).toLocaleString() : 'No data']
    ];
    doc.setFontSize(14); doc.text('Summary', 48, y); y += 10;
    doc.setFontSize(12);
    rows.forEach(function (r) {
      y += 22;
      doc.setDrawColor(210); doc.line(48, y + 6, 547, y + 6);
      doc.text(r[0], 48, y); doc.text(r[1], 300, y);
    });

    y += 40; doc.setFontSize(14); doc.text('Steps, last 7 days', 48, y); y += 14;
    var tr = state.stepsTrend || [];
    if (tr.length) {
      var max = Math.max.apply(null, tr.map(function (x) { return x.v; }).concat([1]));
      var bw = 40, gap = 20, base = y + 120;
      tr.forEach(function (x, i) {
        var h = Math.max(2, (x.v / max) * 110), bx = 48 + i * (bw + gap);
        doc.setFillColor(15, 143, 132); doc.rect(bx, base - h, bw, h, 'F');
        doc.setFontSize(9); doc.setTextColor(90);
        doc.text(String(Math.round(x.v)), bx, base - h - 4);
        doc.text(x.d, bx, base + 12);
      });
      y = base + 40;
    } else { doc.setFontSize(11); doc.setTextColor(120); doc.text('No step history yet. Sync with Health Connect first.', 48, y + 14); y += 40; }

    doc.setTextColor(0); doc.setFontSize(14); doc.text('Notes', 48, y); y += 20; doc.setFontSize(11);
    var notes = [];
    if (state.steps != null) notes.push(state.steps >= 8000 ? 'Steps today are at or above 8,000.' : 'Steps today are below 8,000.');
    if (state.sleepMin != null) notes.push(state.sleepMin >= 420 ? 'Sleep was 7 hours or more.' : 'Sleep was under 7 hours.');
    if (!notes.length) notes.push('Sync or enter data to see notes.');
    notes.forEach(function (n) { doc.text('- ' + n, 48, y); y += 18; });

    doc.setFontSize(9); doc.setTextColor(120);
    doc.text('For wellbeing tracking only. Not medical advice.', 48, 800);
    return doc;
  }

  async function downloadPdf() {
    var btn = $('pdfBtn'); btn.disabled = true;
    try {
      var doc = buildPdf();
      var name = 'GoodHealth-report-' + new Date().toISOString().slice(0, 10) + '.pdf';
      if (isNative()) {
        var FS = plugin('Filesystem'), SH = plugin('Share');
        if (!FS || !SH) throw new Error('Filesystem or Share plugin missing in this build.');
        var b64 = doc.output('datauristring').split(',')[1];
        var res = await FS.writeFile({ path: name, data: b64, directory: 'CACHE' });
        await SH.share({ title: 'GoodHealth report', text: 'My GoodHealth report', url: res.uri, dialogTitle: 'Save or send report' });
        say('Report ready. Choose Drive, Files or any app to save it.', 'ok');
      } else {
        doc.save(name);
        say('Report downloaded.', 'ok');
      }
    } catch (e) {
      if (e && /cancel/i.test(String(e.message || e))) say('Share cancelled.');
      else say('Report failed: ' + (e && e.message ? e.message : e), 'err');
    } finally { btn.disabled = false; }
  }

  $('syncBtn').onclick = syncHealth;
  $('pdfBtn').onclick = downloadPdf;
  render();
})();
</script>
</body>
</html>
